<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Fotos de mi Pakemon</title>

<style>
* {
  box-sizing: border-box;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #ffffff 60%, #cc0000 60%);
}

/* CABECERA */
header {
  background: #ffffff;
  border-bottom: 5px solid #000;
  padding: 15px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 5px 0 #000;
}

.btn-volver {
  padding: 10px 16px;
  background: #cc0000;
  color: #fff;
  border: 3px solid #000;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 3px 3px 0 #000;
  transition: transform 0.1s, box-shadow 0.1s;
}

.btn-volver:hover {
  transform: translate(-1px, -1px);
  box-shadow: 5px 5px 0 #000;
}

header img {
  height: 50px;
}

/* CONTENEDOR */
.container {
  max-width: 800px;
  margin: 30px auto;
  background: #fff;
  border: 5px solid #000;
  border-radius: 18px;
  padding: 25px;
  box-shadow: 8px 8px 0 #000;
}

h1 {
  text-align: center;
  color: #cc0000;
  text-shadow: 2px 2px 0 #000;
}

/* SUBIR FOTO */
.upload-box {
  border: 4px solid #000;
  border-radius: 15px;
  padding: 15px;
  margin-bottom: 25px;
  background: #f8f8f8;
  box-shadow: 4px 4px 0 #000;
}

.upload-box input[type="file"] {
  margin-bottom: 10px;
}

.btn {
  padding: 8px 14px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  border: 3px solid #000;
  background: #cc0000;
  color: #fff;
  box-shadow: 3px 3px 0 #000;
  transition: transform 0.1s, box-shadow 0.1s;
}

.btn:hover {
  transform: translate(-1px, -1px);
  box-shadow: 5px 5px 0 #000;
}

/* POST */
.post {
  border: 4px solid #000;
  border-radius: 15px;
  padding: 15px;
  margin-bottom: 25px;
  background: #ffffff;
  box-shadow: 4px 4px 0 #000;
}

.post-header {
  font-weight: bold;
  margin-bottom: 10px;
  color: #cc0000;
}

.post-image {
  width: 100%;
  max-height: 400px;
  border: 4px solid #000;
  border-radius: 12px;
  object-fit: cover;
  margin-bottom: 15px;
}

/* COMENTARIOS */
.comments {
  margin-top: 15px;
}

.comment {
  border-top: 2px solid #000;
  padding: 8px 0;
  font-size: 14px;
}

.comment strong {
  color: #cc0000;
}

/* FORM COMENTARIO */
.comment-form {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.comment-form input {
  flex: 1;
  padding: 6px;
  border: 3px solid #000;
  border-radius: 8px;
}

.footer {
  text-align: center;
  margin-top: 20px;
  font-size: 12px;
  color: #333;
}
</style>

<script>
function volverListado() {
  window.location.href = "mis_pakemones.php";
}
</script>

</head>

<body>

<header>
  <button class="btn-volver" onclick="volverListado()">⬅ Volver</button>
  <img src="images/pakemonlogo.png" alt="Pakemon Logo">
</header>

<div class="container">

<h1>Fotos de ##NAME##</h1>

<!-- SUBIR FOTO -->
<div class="upload-box">
  <form action="subir_foto.php?id=##ID##" method="POST" enctype="multipart/form-data">
    <input type="file" name="foto" required>
    <br>
    <button class="btn" type="submit">Subir foto 📸</button>
  </form>
</div>

<!-- LISTADO DE POSTS -->
##INIT_POSTS##

<div class="post">

  <img src="##POST_IMAGE##" class="post-image" alt="Foto Pakemon">

  <div class="comments">

    <!-- EJEMPLO COMENTARIO -->
    ##INIT_COMMENTS##
    <div class="comment">
      <strong>##COMMENT_USER##:</strong> ##COMMENT_TEXT##
    </div>
    ##END_COMMENTS##

  </div>

  <!-- FORM AÑADIR COMENTARIO -->
  <form action="comentarmio.php?id=##ID##" method="POST" class="comment-form">
    <input type="hidden" name="post_id" value="##POST_ID##">
    <input type="text" name="comentario" placeholder="Escribe un comentario..." required>
    <button class="btn" type="submit">Comentar</button>
  </form>

</div>

##END_POSTS##

<div class="footer">
  Pakedex Social · Comparte momentos con tu Pakemon 📒🔥
</div>

</div>

</body>
</html>
