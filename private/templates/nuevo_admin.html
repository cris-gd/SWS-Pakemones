<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Libretica Pakemon - Crear Administrador</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #000000 60%, #cc0000 60%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .register-container {
      background: white;
      border: 4px solid #000;
      border-radius: 16px;
      width: 420px;
      padding: 25px;
      box-shadow: 8px 8px 0 #000;
      text-align: center;
      position: relative;
    }

    .logo img {
      max-width: 100%;
      height: auto;
      margin-bottom: 15px;
    }

    h1 {
      margin: 10px 0 20px;
      color: #000;
      text-shadow: 2px 2px 0 #cc0000;
    }

    .admin-badge {
      position: absolute;
      top: -20px;
      left: -20px;
      background: #000;
      color: white;
      border: 3px solid #cc0000;
      border-radius: 50%;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      transform: rotate(-15deg);
      box-shadow: 3px 3px 0 #cc0000;
      text-align: center;
    }

    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }

    label {
      font-weight: bold;
      color: #000;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 3px solid #000;
      border-radius: 8px;
      margin-top: 5px;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: #cc0000;
    }

    .btn {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .btn-register {
      background: #000;
      color: white;
      border: 3px solid #cc0000;
      box-shadow: 3px 3px 0 #cc0000;
    }

    .btn-back {
      background: white;
      color: #000;
      border: 3px dashed #000;
      box-shadow: 3px 3px 0 #000;
    }

    .btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0 #000;
    }

    .burst {
      position: absolute;
      top: -20px;
      right: -20px;
      background: #cc0000;
      color: white;
      border: 3px solid #000;
      border-radius: 50%;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      transform: rotate(15deg);
      box-shadow: 3px 3px 0 #000;
      text-align: center;
    }

    .footer-text {
      margin-top: 15px;
      font-size: 12px;
      color: #333;
    }
  </style>
</head>

<body>

  <div class="register-container">

    <div class="admin-badge">ADMIN<br>SYSTEM</div>
    <div class="burst">¡Nuevo<br>Admin!</div>

    <div class="logo">
      <img src="images/pakemonlogo.png" alt="Pakemon">
    </div>

    <h1>Crear Administrador</h1>

    <form action="anhadir_admin.php" method="POST">

      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username">
      </div>

      <div class="form-group">
        <label for="first_name">Nombre</label>
        <input type="text" id="firstname" name="first_name">
      </div>

      <div class="form-group">
        <label for="last_name">Apellido</label>
        <input type="text" id="last_name" name="last_name">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres">
      </div>

      <div class="form-group">
        <label for="password2">Repite la contraseña</label>
        <input type="password" id="password2" name="password2" placeholder="Otra vez, por si acaso">
      </div>

      <button type="submit" class="btn btn-register">
        Crear Administrador
      </button>
    </form>

    <button class="btn btn-back" onclick="volver()">
      Volver
    </button>

    <div class="footer-text">
      Zona de control Pakemon 🔥⚙️
    </div>
  </div>

  <script>
    function volver() {
      window.location.href = "listado.php";
    }
  </script>

</body>
</html>
