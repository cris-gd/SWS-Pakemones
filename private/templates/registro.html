<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Libretica Pakemon - Registro</title>

  <style>
    /* RESET */
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffffff 60%, #cc0000 60%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* CONTENEDOR */
    .register-container {
      background: white;
      border: 4px solid #000;
      border-radius: 16px;
      width: 420px;
      padding: 25px;
      box-shadow: 8px 8px 0 #000;
      text-align: center;
      position: relative;
    }

    /* LOGO */
    .logo img {
      max-width: 100%;
      height: auto;
      margin-bottom: 15px;
    }

    h1 {
      margin: 10px 0 20px;
      color: #cc0000;
      text-shadow: 2px 2px 0 #000;
    }

    /* FORMULARIO */
    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }

    label {
      font-weight: bold;
      color: #000;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 3px solid #000;
      border-radius: 8px;
      margin-top: 5px;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: #cc0000;
    }

    /* BOTONES */
    .btn {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .btn-register {
      background: #cc0000;
      color: white;
      border: 3px solid #000;
      box-shadow: 3px 3px 0 #000;
    }

    .btn-back {
      background: white;
      color: #000;
      border: 3px dashed #000;
      box-shadow: 3px 3px 0 #000;
    }

    .btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0 #000;
    }

    /* BURBUJA MANGA */
    .burst {
      position: absolute;
      top: -20px;
      right: -20px;
      background: #cc0000;
      color: white;
      border: 3px solid #000;
      border-radius: 50%;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      transform: rotate(15deg);
      box-shadow: 3px 3px 0 #000;
      text-align: center;
    }

    .footer-text {
      margin-top: 15px;
      font-size: 12px;
      color: #333;
    }
  </style>
</head>

<body>

  <div class="register-container">
    <div class="burst">¡Nuevo<br>Pakeadiestrador!</div>

    <!-- LOGO -->
    <div class="logo">
      <img src="images/pakemonlogo.png" alt="PAkemon">
    </div>

    <h1>Registro Pakemon</h1>

    <!-- FORMULARIO -->
    <form action="registro.php" method="POST" onsubmit="return validarRegistro()">

      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" value="##USERNAME##" placeholder="Nombre de Pakeadiestrador">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="##EMAIL##" placeholder="correo@pakemon.es">
      </div>

      <div class="form-group">
        <label for="first_name">First Name</label>
        <input type="text" id="first_name" name="first_name" value="##FIRST_NAME##" placeholder="Nombre">
      </div>

      <div class="form-group">
        <label for="last_name">Last Name</label>
        <input type="text" id="last_name" name="last_name" value="##LAST_NAME##" placeholder="Apellidos">
      </div>



      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres">
      </div>

      <div class="form-group">
        <label for="password2">Repite la contraseña</label>
        <input type="password" id="password2" name="password2" placeholder="Otra vez, por si acaso">
      </div>

      <button type="submit" class="btn btn-register">
        Crear Pakeadiestrador
      </button>
    </form>

    <button class="btn btn-back" onclick="volverLogin()">
      Volver al Login
    </button>

    <div class="footer-text">
      Empieza tu aventura Pakemon 🐖🔥
    </div>
  </div>

  <script>
    function validarRegistro() {
      const user = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const pass1 = document.getElementById("password").value;
      const pass2 = document.getElementById("password2").value;
      const first_name = document.getElementById("first_name").value;
      const last_name = document.getElementById("last_name").value;


      if (!user || !email || !pass1 || !pass2 || !first_name || !last_name) {
        alert("¡Eh! Rellena todos los campos, que esto no es el bar.");
        return false;
      }

      if (pass1.length < 6) {
        alert("La contraseña tiene que tener al menos 6 caracteres, criatura.");
        return false;
      }

      if (pass1 !== pass2) {
        alert("Las contraseñas no coinciden, revisa la libreta.");
        return false;
      }

      return true;
    }

    function volverLogin() {
      window.location.href = "index.php";
    }
  </script>

</body>
</html>
