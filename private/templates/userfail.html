<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Acceso Denegado - Pakemon</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle, #ff0000 0%, #000000 70%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .error-container {
      background: #ffffff;
      border: 6px solid #000;
      border-radius: 18px;
      width: 420px;
      padding: 30px;
      box-shadow: 10px 10px 0 #000;
      text-align: center;
      position: relative;
      animation: shake 0.3s infinite;
    }

    /* ANIMACIÓN DE RABIA */
    @keyframes shake {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-3px, 2px); }
      50% { transform: translate(3px, -2px); }
      75% { transform: translate(-3px, -2px); }
      100% { transform: translate(0, 0); }
    }

    .logo img {
      max-width: 100%;
      margin-bottom: 10px;
      filter: drop-shadow(3px 3px 0 #000);
    }

    h1 {
      color: #cc0000;
      font-size: 28px;
      margin: 10px 0;
      text-shadow: 3px 3px 0 #000;
    }

    .mensaje {
      font-size: 15px;
      color: #000;
      margin: 15px 0 25px;
      font-weight: bold;
    }

    .mensaje span {
      color: #cc0000;
      font-size: 16px;
    }

    .btn {
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      border: 4px solid #000;
      background: #cc0000;
      color: #fff;
      box-shadow: 4px 4px 0 #000;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #000;
    }

    /* VIÑETA MANGA */
    .burst {
      position: absolute;
      top: -25px;
      left: -25px;
      width: 110px;
      height: 110px;
      background: #cc0000;
      color: #fff;
      border: 5px solid #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      transform: rotate(-15deg);
      box-shadow: 4px 4px 0 #000;
    }

    .footer {
      margin-top: 15px;
      font-size: 12px;
      color: #333;
    }
  </style>
</head>

<body>

  <div class="error-container">
    <div class="burst">¡ALTO!</div>

    <div class="logo">
      <img src="images/pakemonlogo.png" alt="PAkemon">
    </div>

    <h1>ACCESO DENEGADO</h1>

    <div class="mensaje">
      Tu contraseña es <span>incorrecta</span>.<br><br>
      Esta Libretica es solo para<br>
      <span>Pakeadiestradores certificados</span>.<br><br>
      Si no sabes distinguir un Brasete de un Jamoncito…<br>
      <span>¡Vuelve al camino!</span>
    </div>

    <button class="btn" onclick="volverLogin()">
      Volver al Login
    </button>

    <div class="footer">
      Pakemon protege su corral 🐖🔥
    </div>
  </div>

  <script>
    function volverLogin() {
      window.location.href = "index.php";
    }
  </script>

</body>
</html>
