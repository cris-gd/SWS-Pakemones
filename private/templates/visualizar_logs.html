<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Logs del Sistema - Pakoadiestradores</title>

<style>
* {
  box-sizing: border-box;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #ffffff 60%, #cc0000 60%);
}

/* CABECERA */
header {
  background: #ffffff;
  border-bottom: 5px solid #000;
  padding: 15px 20px;
  display: flex;
  align-items: center;
  gap: 20px;
  box-shadow: 0 5px 0 #000;
}

.btn-volver {
  padding: 10px 16px;
  background: #cc0000;
  color: #fff;
  border: 3px solid #000;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 3px 3px 0 #000;
}

header img {
  height: 50px;
}

/* CONTENEDOR */
.container {
  max-width: 1100px;
  margin: 30px auto;
  background: #ffffff;
  border: 5px solid #000;
  border-radius: 18px;
  padding: 25px;
  box-shadow: 8px 8px 0 #000;
}

h1 {
  text-align: center;
  color: #cc0000;
  margin-bottom: 25px;
  text-shadow: 2px 2px 0 #000;
}

/* LISTADO */
.log-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.log-row {
  display: grid;
  grid-template-columns: 1fr 1fr 2fr 1fr;
  gap: 10px;
  padding: 12px;
  border: 4px solid #000;
  border-radius: 12px;
  background: #fff;
  box-shadow: 4px 4px 0 #000;
}

.log-data {
  font-weight: bold;
  color: #000;
}

.log-extra {
  grid-column: span 4;
  font-size: 12px;
  color: #333;
  word-break: break-all;
}

/* PAGINACION */
.pagination {
  margin-top: 20px;
  display: flex;
  justify-content: space-between;
}

.page-btn {
  padding: 10px 16px;
  background: #000;
  color: #fff;
  border: 3px solid #000;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 4px 4px 0 #cc0000;
}

.page-btn:hover {
  background: #cc0000;
}

/* PIE */
.footer {
  text-align: center;
  margin-top: 20px;
  font-size: 12px;
  color: #333;
}
</style>

<script>

function volverAdmin(){
  window.location.href="admin.php";
}

function paginar(offset){
  window.location.href="visualizar_logs.php?offset="+offset;
}

</script>

</head>

<body>

<header>
  <button class="btn-volver" onclick="volverAdmin()">⬅ Volver</button>
  <img src="images/pakemonlogo.png">
</header>

<div class="container">

<h1>Logs del Sistema</h1>

<div class="log-list">

##INIT_LIST##

<div class="log-row">

  <div class="log-data">##TIME##</div>
  <div class="log-data">##IP##</div>
  <div class="log-data">##URI##</div>
  <div class="log-data">##METHOD##</div>

  <div class="log-extra"><b>GET:</b> ##GET_DATA##</div>
  <div class="log-extra"><b>POST:</b> ##POST_DATA##</div>
  <div class="log-extra"><b>SESSION:</b> ##SESSION_DATA##</div>
  <div class="log-extra"><b>COOKIE:</b> ##COOKIE_DATA##</div>

</div>

##END_LIST##

</div>

<div class="pagination">

<button class="page-btn" onclick="paginar(##OFFSET_PREV##)">⬅ Anterior</button>
<button class="page-btn" onclick="paginar(##OFFSET_NEXT##)">Siguiente ➡</button>

</div>

<div class="footer">
Panel interno de auditoría Pakémon 🔎🔥
</div>

</div>

</body>
</html>
