<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Libretica Pakemon - Añadir Pakemon</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffffff 60%, #cc0000 60%);
    }

    /* CABECERA */
    header {
      background: #ffffff;
      border-bottom: 5px solid #000;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      justify-content: space-between;
      box-shadow: 0 5px 0 #000;
    }

    header img {
      height: 50px;
    }

    .btn-volver {
      padding: 10px 16px;
      background: #cc0000;
      color: #fff;
      border: 3px solid #000;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 3px 3px 0 #000;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .btn-volver:hover {
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0 #000;
    }

    /* CONTENEDOR */
    .register-container {
      max-width: 600px;
      margin: 30px auto;
      background: #fff;
      border: 5px solid #000;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 8px 8px 0 #000;
      position: relative;
    }

    h1 {
      text-align: center;
      color: #cc0000;
      text-shadow: 2px 2px 0 #000;
      margin-bottom: 20px;
    }

    /* FORMULARIO */
    .form-group {
      margin-bottom: 12px;
      text-align: left;
    }

    label {
      font-weight: bold;
      color: #000;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 3px solid #000;
      border-radius: 8px;
      margin-top: 5px;
      font-size: 14px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #cc0000;
    }

    /* BOTONES */
    .btn {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      border: 3px solid #000;
      box-shadow: 3px 3px 0 #000;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0 #000;
    }

    .btn-register {
      background: #cc0000;
      color: #fff;
    }

    .btn-back {
      background: #fff;
      color: #000;
    }

    /* BURBUJA */
    .burst {
      position: absolute;
      top: -20px;
      right: -20px;
      background: #cc0000;
      color: white;
      border: 3px solid #000;
      border-radius: 50%;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      transform: rotate(15deg);
      box-shadow: 3px 3px 0 #000;
      text-align: center;
    }

    .footer-text {
      margin-top: 15px;
      font-size: 12px;
      color: #333;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <button class="btn-volver" onclick="volverAdmin()">⬅ Volver</button>
  <img src="images/pakemonlogo.png" alt="Pakemon Logo">
  <div></div>
</header>

<div class="register-container">
  <div class="burst">¡Nuevo<br>Pakemon!</div>

  <h1>Añadir Pakemon</h1>

  <form action="anadir_pakemon.php" method="POST" enctype="multipart/form-data" onsubmit="return validarPakemon()">

    <div class="form-group">
      <label for="pakedex_number">Número Pakedex</label>
      <input type="number" id="pakedex_number" name="pakedex_number" placeholder="" value="##PAKEDEX_NUMBER##">
    </div>

    <div class="form-group">
      <label for="name">Nombre</label>
      <input type="text" id="name" name="name" placeholder="" value="##NAME##">
    </div>

    <div class="form-group">
      <label for="generation">Generación</label>
      <input type="number" id="generation" name="generation" placeholder="" value="##GENERATION##">
    </div>

    <div class="form-group">
      <label for="region_id">Región</label>
      <select id="region_id" name="region_id">
        <option value="">-- Selecciona Región --</option>
	##INIT_OPTION_REGION##
        <option value="##VALUE##">##REGION##</option>
	##END_OPTION_REGION##
	##INIT_OPTION_SELREGION##
        <option value="##VALUE##" selected>##REGION##</option>
	##END_OPTION_SELREGION##


      </select>
    </div>

    <div class="form-group">
      <label for="form">Forma</label>
      <input type="text" id="form" name="form" placeholder="" value="##FORM##">
    </div>

    <div class="form-group">
      <label for="primary_type_id">Tipo Primario</label>
      <select id="primary_type_id" name="primary_type_id">
	<option value="">-- Ninguno / Selecciona Tipo --</option>
	##INIT_OPTION1##
        <option value="##VALUE##">##TIPO##</option>
	##END_OPTION1##
	##INIT_SELOPTION1##
        <option value="##VALUE##" selected>##TIPO##</option>
	##END_SELOPTION1##


      </select>
    </div>

    <div class="form-group">
      <label for="secondary_type_id">Tipo Secundario</label>
      <select id="secondary_type_id" name="secondary_type_id">
        <option value="">-- Ninguno / Selecciona Tipo --</option>
	##INIT_OPTION2##
        <option value="##VALUE##">##TIPO##</option>
	##END_OPTION2##
	##INIT_SELOPTION2##
        <option value="##VALUE##" selected>##TIPO##</option>
	##END_SELOPTION2##
      </select>
    </div>

    <div class="form-group">
      <label for="category">Categoría</label>
      <input type="text" id="category" name="category" placeholder="" value="##CATEGORY##">
    </div>

    <div class="form-group">
      <label for="color">Color</label>
      <input type="text" id="color" name="color" placeholder="" value="##COLOR##">
    </div>

    <div class="form-group">
      <label for="group">Grupo</label>
      <input type="text" id="group" name="group" placeholder="" value="##GROUP##">
    </div>

    <div class="form-group">
      <label for="height_m">Altura (m)</label>
      <input type="number" step="0.01" id="height_m" name="height_m" placeholder="" value="##HEIGHT_M##">
    </div>

    <div class="form-group">
      <label for="weight_kg">Peso (kg)</label>
      <input type="number" step="0.1" id="weight_kg" name="weight_kg" placeholder="" value="##WEIGHT_KG##">
    </div>

    <div class="form-group">
      <label for="body_shape">Forma Corporal</label>
      <input type="text" id="body_shape" name="body_shape" placeholder="" value="##BODY_SHAPE##">
    </div>

    <div class="form-group">
      <label for="habitat">Hábitat</label>
      <input type="text" id="habitat" name="habitat" placeholder="" value="##HABITAT##">
    </div>

    <div class="form-group">
      <label for="gender">Género</label>
      <input type="text" id="gender" name="gender" placeholder="" value="##GENDER##">
    </div>

    <div class="form-group">
      <label for="gender_ratio">Ratio de Género</label>
      <input type="text" id="gender_ratio" name="gender_ratio" placeholder="" value="##GENDER_RATIO##">
    </div>

    <div class="form-group">
      <label for="photo">Foto</label>
      <input type="file" id="photo" name="photo" accept="image/*">
    </div>

    <button type="submit" class="btn btn-register">Añadir Pakemon</button>
  </form>

  <button class="btn btn-back" onclick="volverAdmin()">Volver al Panel</button>

  <div class="footer-text">
    Añade tu Pakemon al sistema 🐖🔥
  </div>
</div>

<script>
  function validarPakemon() {
    const requiredFields = [
      "pakedex_number", "name", "generation", "region_id",
      "form", "primary_type_id", "category", "color",
      "group", "height_m", "weight_kg", "body_shape",
      "habitat", "gender", "gender_ratio", "photo"
    ];

    for (let field of requiredFields) {
      const value = document.getElementById(field).value;
      if (!value) {
        alert(`¡Eh! El campo "${field}" es obligatorio.`);
        return false;
      }
    }

    return true;
  }

  function volverAdmin() {
    window.location.href = "listado_pakemones.php";
  }
</script>

</body>
</html>
